<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    

  </head>
    
  <body>
  <html>
<head>
<title>STUDENT COMPUTER CENTRE</title>

<style>
body{
    font-family: Arial;
    background-color:#f2f2f2;
}

fieldset{
    background:white;
    border:2px solid blue;
    padding:20px;
    width:60%;
    margin:auto;
}

legend{
    color:darkblue;
    font-size:25px;
    font-weight:bold;
}

table{
    width:100%;
}

td{
    padding:8px;
}

h2{
    color:green;
}
</style>

</head>

<body>

<div>

<fieldset>

<legend>Student Computer Centre</legend>

<form name="frmStudent" method="POST">

<table>

<tr>
<td align="right">Student Name :</td>
<td>
<input type="text" name="txtName" size="25">
</td>
</tr>

<tr>
<td align="right">Father Name :</td>
<td>
<input type="text" name="txtFather" size="25">
</td>
</tr>

<tr>
<td align="right">Mobile Number :</td>
<td>
<input type="text" name="txtMobile" size="25">
</td>
</tr>

<tr>
<td align="right">Address :</td>
<td>
<textarea rows="3" cols="25"></textarea>
</td>
</tr>

<tr>
<td align="right">Password :</td>
<td>
<input type="password" name="pwdPassword" size="25">
</td>
</tr>

<tr>
<td align="right">Gender :</td>
<td>
<input type="radio" name="gender"> Male

<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td align="right">Select Course :</td>
<td>

<input type="checkbox"> Python <br>

<input type="checkbox"> HTML <br>

<input type="checkbox"> CSS <br>

<input type="checkbox"> JavaScript <br>

<input type="checkbox"> PHP <br>

<input type="checkbox"> C Language <br>

<input type="checkbox"> MS Office

</td>
</tr>

<tr>
<td align="right">Course Duration :</td>
<td>

<select>
<option>3 Months</option>
<option>6 Months</option>
<option>1 Year</option>
</select>

</td>
</tr>

<tr>
<td align="right">Terms :</td>
<td>
<input type="checkbox"> I Agree
</td>
</tr>

<tr>
<td></td>
<td>
<input type="submit" value="Submit">

<input type="reset" value="Reset">
</td>
</tr>

</table>

</form>

</fieldset>

</div>

</body>
</html>
    
  </body>
  
</html>
